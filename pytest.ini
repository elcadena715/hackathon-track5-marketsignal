[pytest]
# Configuración de pytest

# Carpeta de tests
testpaths = test

# Archivos de test
python_files = test_*.py

# Pattern de funciones de test
python_functions = test_*

# Mostrar prints
addopts = -v --tb=short -ra

# Timeout para tests (segundos)
timeout = 30

# Markers custom
markers =
    agent: Tests del motor agéntico
    database: Tests de persistencia
    data: Tests de integridad de datos
    integration: Tests de integración
